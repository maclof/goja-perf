name: linux-amd64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-amd64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.25.x, 1.x]
    env:
      GOARCH: amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          architecture: x64
          cache-dependency-path: go.sum

      - name: Check formatting
        if: ${{ matrix.go-version == '1.x' }}
        run: diff -u <(printf '') <(gofmt -d .)

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        if: ${{ matrix.go-version == '1.x' }}
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "2026.2"
          install-go: false
          # v1.4.1 embeds actions/cache@v4 (Node 20). setup-go still caches Go
          # downloads/builds; disable only Staticcheck's private cache until
          # the action updates its embedded cache runtime.
          use-cache: false

      - name: Check out tc39 tests
        if: ${{ matrix.go-version == '1.x' }}
        run: ./.tc39_test262_checkout.sh

      - name: Run tests
        run: go test -vet=off ./...
