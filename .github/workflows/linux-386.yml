name: linux-386

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-386-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.25.x, 1.x]
    env:
      GOARCH: "386"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          architecture: x64
          cache-dependency-path: go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Check out tc39 tests
        if: ${{ matrix.go-version == '1.x' }}
        run: ./.tc39_test262_checkout.sh

      - name: Run tests
        run: go test -vet=off ./...
